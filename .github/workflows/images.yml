name: Images

on:
  push:
    branches: [main]
    paths: ['images/**', '.github/workflows/images.yml']
  pull_request:
    paths: ['images/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-amd64:
    name: minimal (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise exec -- shellcheck images/runner/*.sh images/runner/smoke/*.sh images/runner/minimal/muster-runner images/runner/e2e/run.sh
      - run: bash images/runner/build.sh minimal
      - run: bash images/runner/smoke/image-test.sh
      - run: bash images/runner/smoke/entrypoint-test.sh
      - run: bash images/runner/smoke.sh container
      - run: bash images/runner/build.sh e2e
      - run: bash images/runner/smoke/e2e-stub-test.sh

  publish-minimal-amd64:
    name: publish minimal (amd64)
    needs: minimal-amd64
    # Restricted to main so a dispatch from a branch cannot move minimal-latest.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          tag="$(bash images/runner/build.sh minimal)"
          bash images/runner/smoke/image-test.sh
          docker push "$tag"
          docker push ghcr.io/liquidmetal-dev/muster-runner:minimal-latest
